# -----------------------------------------------------------------------------
# Intensity-TTA evaluation on the existing CVC-ClinicDB checkpoints (no retraining).
#
# Adds three photometric view sets to baseline/tta4.  Intensity views need no inverse: the
# transform acts on the normalized input and the probability map comes back in the original
# geometry (melba/transforms/intensity.py).
#
#   intensity4  : identity, brightness x1.1, contrast x1.1, gamma 1.25
#   intensity8  : the four above plus brightness x0.9, contrast x0.9, gamma 0.8, noise 0.02
#   geo4_int4   : the four tta4 geometric views x {identity, brightness x1.1}
# -----------------------------------------------------------------------------
defaults:
  - unet_resnet50.yaml

experiment:
  name: cvc_clinicdb_unet_resnet50_intensity4
  description: "UNet + intensity4 TTA only (used for the external polyp sets, where baseline/tta4 are re-computed in the same CSVs)"

evaluation:
  output_dir: results/${experiment.name}/evaluation

# evaluate the *existing* UNet grid: the checkpoint pattern keeps the training experiment
model:
  checkpoint: checkpoints/cvc_clinicdb_unet_resnet50/fold{fold}_seed{seed}/best.pt

tta:
  methods:
    - name: baseline
      aggregator: mean
      views:
        - { name: identity, ops: [] }
    - name: tta4
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: rot180, ops: [{ type: rot90, k: 2, axes: [h, w] }] }
        - { name: hflip, ops: [{ type: flip, axes: [w] }] }
        - { name: vflip, ops: [{ type: flip, axes: [h] }] }
    - name: intensity4
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: bright_11, ops: [{ type: brightness, factor: 1.1 }] }
        - { name: contrast_11, ops: [{ type: contrast, factor: 1.1 }] }
        - { name: gamma_125, ops: [{ type: gamma, gamma: 1.25 }] }

