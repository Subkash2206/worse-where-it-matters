# -----------------------------------------------------------------------------
# Intensity-TTA evaluation on the existing CVC-ClinicDB checkpoints (no retraining).
#
# Adds three photometric view sets to baseline/tta4.  Intensity views need no inverse: the
# transform acts on the normalized input and the probability map comes back in the original
# geometry (melba/transforms/intensity.py).
#
#   intensity4  : identity, brightness x1.1, contrast x1.1, gamma 1.25
#   intensity8  : the four above plus brightness x0.9, contrast x0.9, gamma 0.8, noise 0.02
#   geo4_int4   : the four tta4 geometric views x {identity, brightness x1.1}
# -----------------------------------------------------------------------------
defaults:
  - swinunetr_2d.yaml

experiment:
  name: cvc_clinicdb_swinunetr_2d_intensity_tta
  description: "SwinUNETR + intensity TTA (intensity4/intensity8/geo4_int4) on the trained folds"

evaluation:
  output_dir: results/${experiment.name}/evaluation

tta:
  methods:
    - name: baseline
      aggregator: mean
      views:
        - { name: identity, ops: [] }
    - name: tta4
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: rot180, ops: [{ type: rot90, k: 2, axes: [h, w] }] }
        - { name: hflip, ops: [{ type: flip, axes: [w] }] }
        - { name: vflip, ops: [{ type: flip, axes: [h] }] }
    - name: intensity4
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: bright_11, ops: [{ type: brightness, factor: 1.1 }] }
        - { name: contrast_11, ops: [{ type: contrast, factor: 1.1 }] }
        - { name: gamma_125, ops: [{ type: gamma, gamma: 1.25 }] }
    - name: intensity8
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: bright_11, ops: [{ type: brightness, factor: 1.1 }] }
        - { name: contrast_11, ops: [{ type: contrast, factor: 1.1 }] }
        - { name: gamma_125, ops: [{ type: gamma, gamma: 1.25 }] }
        - { name: bright_09, ops: [{ type: brightness, factor: 0.9 }] }
        - { name: contrast_09, ops: [{ type: contrast, factor: 0.9 }] }
        - { name: gamma_08, ops: [{ type: gamma, gamma: 0.8 }] }
        - { name: noise_002, ops: [{ type: gaussian_noise, sigma: 0.02, seed: 0 }] }
    - name: geo4_int4
      aggregator: mean
      views:
        - { name: identity, ops: [] }
        - { name: rot180, ops: [{ type: rot90, k: 2, axes: [h, w] }] }
        - { name: hflip, ops: [{ type: flip, axes: [w] }] }
        - { name: vflip, ops: [{ type: flip, axes: [h] }] }
        - { name: identity_b11, ops: [{ type: brightness, factor: 1.1 }] }
        - { name: rot180_b11, ops: [{ type: rot90, k: 2, axes: [h, w] }, { type: brightness, factor: 1.1 }] }
        - { name: hflip_b11, ops: [{ type: flip, axes: [w] }, { type: brightness, factor: 1.1 }] }
        - { name: vflip_b11, ops: [{ type: flip, axes: [h] }, { type: brightness, factor: 1.1 }] }

