[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melba-tta"
version = "0.1.0"
description = "Geometry-aware test-time augmentation for medical image segmentation (MELBA journal extension)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "opencv-python-headless>=4.8",
    "tifffile>=2024.1",
    "monai>=1.3",
    "segmentation-models-pytorch>=0.4",
    "nibabel>=5.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
